<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나랑 데이트 할래? 🌸</title>
    <style>
        /* 웹사이트 배경 및 기본 폰트 설정 */
        body {
            background-color: #ffe6ea;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 340px;
            max-height: 85vh; 
            overflow-y: auto; 
        }

        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        button {
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .primary-btn {
            background-color: #ff6b81;
            color: white;
            margin: 5px;
        }
        .primary-btn:hover { transform: scale(1.05); }

        #no-btn {
            background-color: #e0e0e0;
            color: #555;
            position: relative;
            margin: 5px;
        }

        .hidden { display: none !important; }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-btn {
            background-color: #f8f9fa;
            border: 2px solid #ff6b81;
            color: #333;
            padding: 20px 10px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            background-color: #ff6b81;
            color: white;
            transform: translateY(-3px);
        }
        .menu-icon {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff6b81;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .tab-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .tab-btn {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 8px;
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #dee2e6;
        }
        .tab-btn.active, .tab-btn:hover {
            background-color: #ff6b81;
            color: white;
            border-color: #ff6b81;
        }

        .station-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .station-item {
            background-color: #fff;
            border: 1px solid #ff6b81;
            color: #ff6b81;
            padding: 12px 5px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .station-item:hover {
            background-color: #ff6b81;
            color: white;
        }

        .result-box {
            background-color: #fff0f2;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            line-height: 1.8;
            font-size: 18px;
            color: #555;
        }
        .highlight {
            color: #ff6b81;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="step1" class="card">
        <h1>🌸 나랑 데이트 할래? 🌸</h1>
        <div>
            <button class="primary-btn" onclick="nextStep(2)">좋아~!~! ❤️</button>
            <button id="no-btn">싫어. 🐾</button>
        </div>
    </div>

    <div id="step2" class="card hidden">
        <h1>그래서... 우리 언제 볼까? 🗓️</h1>
        <input type="date" id="date-input">
        <input type="time" id="time-input">
        <button class="primary-btn" style="margin-top:20px; width: 100%;" onclick="goToMenu()">이 날짜로 할게!</button>
    </div>

    <div id="step3" class="card hidden">
        <h1>그래! 이 날 뭐 먹고 싶어? 😋</h1>
        <div class="menu-grid">
            <button class="menu-btn" onclick="goToMap('훠궈')"><span class="menu-icon">🍲</span>훠궈</button>
            <button class="menu-btn" onclick="goToMap('파스타')"><span class="menu-icon">🍝</span>파스타</button>
            <button class="menu-btn" onclick="goToMap('초밥')"><span class="menu-icon">🍣</span>초밥</button>
            <button class="menu-btn" onclick="goToMap('고기')"><span class="menu-icon">🥩</span>고기</button>
        </div>
    </div>

    <div id="step4" class="card hidden">
        <h1>어디서 만날까? 🚇</h1>
        <input type="text" id="station-search" class="search-box" placeholder="역 이름 검색 (예: 강남)" onkeyup="searchStation()">
        
        <div class="tab-container" id="tab-container">
            <button class="tab-btn active" onclick="filterTab('전체', this)">전체</button>
            <button class="tab-btn" onclick="filterTab('ㄱ', this)">ㄱ</button>
            <button class="tab-btn" onclick="filterTab('ㄴ', this)">ㄴ</button>
            <button class="tab-btn" onclick="filterTab('ㄷ', this)">ㄷ</button>
            <button class="tab-btn" onclick="filterTab('ㄹ', this)">ㄹ</button>
            <button class="tab-btn" onclick="filterTab('ㅁ', this)">ㅁ</button>
            <button class="tab-btn" onclick="filterTab('ㅂ', this)">ㅂ</button>
            <button class="tab-btn" onclick="filterTab('ㅅ', this)">ㅅ</button>
            <button class="tab-btn" onclick="filterTab('ㅇ', this)">ㅇ</button>
            <button class="tab-btn" onclick="filterTab('ㅈ', this)">ㅈ</button>
            <button class="tab-btn" onclick="filterTab('ㅊ', this)">ㅊ</button>
            <button class="tab-btn" onclick="filterTab('ㅋ', this)">ㅋ</button>
            <button class="tab-btn" onclick="filterTab('ㅌ', this)">ㅌ</button>
            <button class="tab-btn" onclick="filterTab('ㅍ', this)">ㅍ</button>
            <button class="tab-btn" onclick="filterTab('ㅎ', this)">ㅎ</button>
        </div>

        <div id="station-grid" class="station-grid"></div>
    </div>

    <div id="step5" class="card hidden">
        <h1>🎉 데이트 약속 확정! 🎉</h1>
        <div class="result-box">
            📅 <span class="highlight" id="res-date"></span><br>
            ⏰ <span class="highlight" id="res-time"></span><br>
            🍽️ 메뉴는 <span class="highlight" id="res-menu"></span><br>
            📍 장소는 <span class="highlight" id="res-station"></span>
        </div>
        <p style="font-weight: bold;">예쁘게 하구 와~ㅎ 🚗</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // ⚠️ 형님! 바로 아래 따옴표 안에 발급받은 디스코드 웹훅 주소를 넣어주십시오! ⚠️
        const webhookUrl = "https://discord.com/api/webhooks/1540732781473046600/Wpv1bkhZ5dJLsRbR-GBX0iy4rFg14V9JVP9KceDdMdYyaq-kYT768KKUL1tlb1mswOfQ";

        let selectedDate = '';
        let selectedTime = '';
        let selectedMenu = '';

        const noBtn = document.getElementById('no-btn');
        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', function(e) { e.preventDefault(); moveButton(); });

        function nextStep(step) {
            document.querySelectorAll('.card').forEach(card => card.classList.add('hidden'));
            document.getElementById('step' + step).classList.remove('hidden');
        }

        function goToMenu() {
            selectedDate = document.getElementById('date-input').value;
            selectedTime = document.getElementById('time-input').value;
            if(!selectedDate || !selectedTime) { alert("날짜와 시간을 꼭 선택해 줘!"); return; }
            const dateObj = new Date(selectedDate);
            selectedDate = `${dateObj.getFullYear()}년 ${dateObj.getMonth() + 1}월 ${dateObj.getDate()}일`;
            nextStep(3);
        }

        function goToMap(menu) {
            selectedMenu = menu;
            nextStep(4);
            renderStations(stationList); 
        }

        function finish(station) {
            const finalStation = station + "역";
            document.getElementById('res-date').innerText = selectedDate;
            document.getElementById('res-time').innerText = selectedTime;
            document.getElementById('res-menu').innerText = selectedMenu;
            document.getElementById('res-station').innerText = finalStation;
            
            nextStep(5);

           // 💡 디스코드로 알림 쏘는 마법의 코드 (보안 우회 프록시 적용!)
        if(webhookUrl !== "https://discord.com/api/webhooks/1540732781473046600/Wpv1bkhZ5dJLsRbR-GBX0iy4rFg14V9JVP9KceDdMdYyaq-kYT768KKUL1tlb1mswOfQ") {
            const message = {
                content: `🌸 **새로운 데이트 예약이 도착했습니다, 형님!** 🌸\n\n📅 **날짜:** ${selectedDate}\n⏰ **시간:** ${selectedTime}\n🍽️ **메뉴:** ${selectedMenu}\n📍 **장소:** ${finalStation}`
            };

            // 브라우저 차단을 뚫기 위해 무료 프록시(corsproxy.io)를 경유합니다.
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(webhookUrl);

            fetch(proxyUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(message)
            })
            .then(response => {
                if(!response.ok) throw new Error("전송 실패");
                console.log("알림 전송 성공!");
            })
            .catch(err => {
                console.error("알림 에러 발생:", err);
            });
        }
            
            var duration = 3 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff6b81', '#ffffff'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff6b81', '#ffffff'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        const stationList = [
            '가락시장', '가산디지털단지', '강남', '강남구청', '강동', '강변', '건대입구', '고속터미널', '공덕', '교대', '구로디지털단지', '김포공항',
            '낙성대', '노량진', '노원', '논현', 
            '당산', '대림', '대학로', '동대문', '동대문역사문화공원', '디지털미디어시티', '뚝섬', '뚝섬유원지',
            '마곡', '마포', '망원', '명동', '목동',
            '반포', '방배', '보라매', '부평', '부천',
            '사당', '삼성', '서울대입구', '서울역', '서초', '선릉', '성수', '송파', '수서', '시청', '신논현', '신도림', '신림', '신사', '신촌',
            '아현', '안국', '압구정', '압구정로데오', '양재', '여의도', '여의나루', '역삼', '연신내', '영등포', '영등포구청', '오목교', '왕십리', '용산', '이대', '이수', '이태원',
            '잠실', '정자', '종각', '종로3가', '을지로입구', '을지로3가', '을지로4가', 
            '천호', '청담', '청량리', '충무로', 
            '판교', 
            '합정', '혜화', '홍대입구', '화곡', '회기'
        ];

        function getInitial(str) {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            const code = str.charCodeAt(0) - 44032;
            if (code > -1 && code < 11172) {
                let chosung = cho[Math.floor(code / 588)];
                const map = {'ㄲ':'ㄱ', 'ㄸ':'ㄷ', 'ㅃ':'ㅂ', 'ㅆ':'ㅅ', 'ㅉ':'ㅈ'};
                return map[chosung] || chosung;
            }
            return str.charAt(0);
        }

        function renderStations(list) {
            const grid = document.getElementById('station-grid');
            grid.innerHTML = ''; 
            if(list.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; color:#999;">검색 결과가 없어!</p>';
                return;
            }
            list.forEach(station => {
                const btn = document.createElement('button');
                btn.className = 'station-item';
                btn.innerText = station;
                btn.onclick = () => finish(station);
                grid.appendChild(btn);
            });
        }

        function filterTab(consonant, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            document.getElementById('station-search').value = '';

            if (consonant === '전체') {
                renderStations(stationList);
            } else {
                const filtered = stationList.filter(station => getInitial(station) === consonant);
                renderStations(filtered);
            }
        }

        function searchStation() {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const keyword = document.getElementById('station-search').value.trim();
            if (keyword === '') {
                renderStations(stationList);
                return;
            }
            const filtered = stationList.filter(station => station.includes(keyword));
            renderStations(filtered);
        }
    </script>
</body>
</html>
